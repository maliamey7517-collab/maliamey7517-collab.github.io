<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mangalmurti Clinic | Professional Case Sheet</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --teal: #1a4a3f;
      --teal-mid: #226454;
      --gold: #c17f3a;
      --gold-light: #e6c394;
      --sand: #f9f6ef;
      --warm: #ece4d7;
      --border: #e2d8cb;
      --ink: #2c2c28;
      --muted: #6b5e4f;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.10);
    }

    body {
      background: #f4efe6;
      font-family: 'DM Sans', sans-serif;
      color: var(--ink);
      scroll-behavior: smooth;
    }

    /* ── HEADER ── */
    .clinic-header {
      background: var(--teal);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 18px rgba(0, 0, 0, 0.12);
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      background: linear-gradient(145deg, var(--gold), #b46f2a);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 600;
      color: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .brand-text h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.65rem;
      font-weight: 600;
      color: white;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 0.68rem;
      letter-spacing: 1px;
      color: rgba(255, 245, 225, 0.85);
      text-transform: uppercase;
    }

    .progress-area {
      min-width: 200px;
    }

    .progress-track {
      background: rgba(255, 248, 235, 0.2);
      border-radius: 30px;
      height: 6px;
    }

    .progress-fill {
      background: linear-gradient(90deg, var(--gold-light), var(--gold));
      width: 0%;
      height: 6px;
      border-radius: 30px;
      transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    .step-label {
      font-size: 0.7rem;
      text-align: right;
      color: #e9ddce;
      margin-top: 5px;
      font-weight: 500;
    }

    /* ── TABS ── */
    .step-tabs {
      background: white;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .step-tabs-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      padding: 0 20px;
      gap: 2px;
    }

    .step-tab {
      background: none;
      border: none;
      padding: 13px 16px;
      font-size: 0.78rem;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      color: #7f6e5c;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .step-tab .step-number {
      width: 22px;
      height: 22px;
      background: #e8dfd4;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      font-weight: bold;
      color: #5e4e3c;
      transition: all 0.2s;
    }

    .step-tab.active {
      color: var(--teal);
      border-bottom-color: var(--gold);
    }

    .step-tab.active .step-number {
      background: var(--teal);
      color: white;
    }

    .step-tab.completed .step-number {
      background: var(--gold);
      color: white;
    }

    /* ── LAYOUT ── */
    .main-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 28px 80px;
    }

    .step-panel {
      display: none;
      animation: fadeSlide 0.32s ease-out;
    }

    .step-panel.active-panel {
      display: block;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .step-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.1rem;
      font-weight: 500;
      color: var(--teal);
      margin-bottom: 0.4rem;
    }

    .step-sub {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 2rem;
      border-left: 3px solid var(--gold-light);
      padding-left: 12px;
    }

    /* ── CARD ── */
    .clinic-card {
      background: white;
      border-radius: 22px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 32px 36px;
      margin-bottom: 28px;
      transition: box-shadow 0.2s;
    }

    .clinic-card:hover {
      box-shadow: var(--shadow-md);
    }

    .card-header-flex {
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1.5px solid var(--warm);
      margin-bottom: 28px;
      padding-bottom: 16px;
    }

    .card-icon {
      background: #f3ede5;
      width: 46px;
      height: 46px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .card-header-flex h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.55rem;
      font-weight: 500;
      color: var(--teal);
    }

    /* ── GRID / FORM ── */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .full-width {
      grid-column: span 2;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-tag {
      font-size: 0.69rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
    }

    .field-section-gap {
      margin-top: 22px;
    }

    input,
    select,
    textarea {
      border: 1.5px solid #e7dfd4;
      border-radius: 12px;
      padding: 11px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      background: #ffffff;
      transition: all 0.2s;
      width: 100%;
      outline: none;
      color: var(--ink);
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(193, 127, 58, 0.1);
    }

    textarea {
      resize: vertical;
      line-height: 1.6;
    }

    /* ── RADIO BUTTONS (gender, posture, etc.) ── */
    .radio-group-modern {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }

    .radio-label {
      background: #fbf8f3;
      border: 1.5px solid #e2d8cb;
      border-radius: 40px;
      padding: 8px 18px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    .radio-label input[type="radio"] {
      width: 15px;
      height: 15px;
      accent-color: var(--gold);
      cursor: pointer;
    }

    .radio-label:has(input:checked) {
      background: #fff1e3;
      border-color: var(--gold);
      color: #8b5a2b;
      font-weight: 500;
    }

    /* ── CHECKBOX GROUP (sleep) ── */
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 6px;
    }

    .check-label {
      background: #fbf8f3;
      border: 1.5px solid #e2d8cb;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
      user-select: none;
    }

    .check-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--gold);
      cursor: pointer;
    }

    .check-label:has(input:checked) {
      background: #fff1e3;
      border-color: var(--gold);
      color: #8b5a2b;
      font-weight: 500;
    }

    /* ── MODALITY ── */
    .modality-section {
      margin-bottom: 28px;
    }

    .modality-section-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: #4c6b5e;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px dashed #ddd0c0;
    }

    .modality-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modality-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      background: #fcf9f4;
      border: 1px solid #e8dfd2;
      border-radius: 12px;
      padding: 10px 16px;
    }

    .mod-name {
      font-size: 0.82rem;
      font-weight: 500;
      color: #2c4a3b;
    }

    .mod-options {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .mod-badge {
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 500;
      background: white;
      border: 1px solid #cfc3b4;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .mod-badge:hover {
      border-color: var(--gold);
    }

    .selected-better {
      background: #dff0e9;
      border-color: #2c7a5a;
      color: #1c5e44;
    }

    .selected-worse {
      background: #ffe6e5;
      border-color: #c75c4a;
      color: #9b3a2a;
    }

    .selected-noeffect {
      background: #fff0db;
      border-color: #d9a13b;
      color: #8b5e1c;
    }

    /* ── FOOD TABLE: radio-per-row ── */
    .food-table-wrapper {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .food-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .food-table th {
      text-align: center;
      background: #f3ede3;
      padding: 12px 10px;
      font-weight: 600;
      color: #5b4c38;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .food-table th:first-child {
      text-align: left;
      padding-left: 18px;
    }

    .food-table td {
      border-bottom: 1px solid #ece1d4;
      padding: 11px 10px;
      text-align: center;
      vertical-align: middle;
    }

    .food-table tr:last-child td {
      border-bottom: none;
    }

    .food-table td:first-child {
      text-align: left;
      font-weight: 500;
      padding-left: 18px;
      color: #3a3028;
    }

    .food-table tr:hover td {
      background: #fdf9f4;
    }

    /* Radio as styled circle */
    .food-radio {
      display: inline-block;
      cursor: pointer;
    }

    .food-radio input[type="radio"] {
      display: none;
    }

    .food-radio-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #d0c4b4;
      background: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .food-radio input[type="radio"]:checked+.food-radio-dot.like-dot {
      background: #2c7a5a;
      border-color: #2c7a5a;
    }

    .food-radio input[type="radio"]:checked+.food-radio-dot.like-dot::after {
      content: '✓';
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .food-radio input[type="radio"]:checked+.food-radio-dot.dislike-dot {
      background: #c75c4a;
      border-color: #c75c4a;
    }

    .food-radio input[type="radio"]:checked+.food-radio-dot.dislike-dot::after {
      content: '✗';
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .food-radio input[type="radio"]:checked+.food-radio-dot.disagree-dot {
      background: #c17f3a;
      border-color: #c17f3a;
    }

    .food-radio input[type="radio"]:checked+.food-radio-dot.disagree-dot::after {
      content: '!';
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .food-radio-dot:hover {
      border-color: var(--gold);
      transform: scale(1.08);
    }

    /* ── NAV BUTTONS ── */
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 32px;
      gap: 16px;
    }

    .btn {
      border: none;
      padding: 12px 28px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s;
      font-family: 'DM Sans', sans-serif;
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid #cdbfaf;
      color: #5e4e3c;
    }

    .btn-outline:hover {
      border-color: var(--gold);
      background: #fffaf3;
    }

    .btn-primary {
      background: var(--teal);
      color: white;
      box-shadow: 0 4px 10px rgba(26, 74, 63, 0.2);
    }

    .btn-primary:hover {
      background: var(--teal-mid);
      transform: translateY(-1px);
    }

    .btn-gold {
      background: linear-gradient(135deg, #c17f3a, #dba459);
      color: white;
      box-shadow: 0 6px 14px rgba(193, 127, 58, 0.3);
      padding: 14px 36px;
      font-size: 0.88rem;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(193, 127, 58, 0.4);
    }

    /* ── SUMMARY ── */
    .summary-glass {
      background: #fefcf8;
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 24px;
      max-height: 520px;
      overflow-y: auto;
    }

    .summary-item {
      margin-bottom: 18px;
      border-left: 3px solid var(--gold-light);
      padding-left: 14px;
    }

    .summary-item strong {
      color: var(--teal);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 4px;
    }

    .summary-item span {
      font-size: 0.84rem;
      color: #3a3028;
      line-height: 1.6;
    }

    @media (max-width: 720px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .full-width {
        grid-column: span 1;
      }

      .clinic-card {
        padding: 20px 18px;
      }

      .main-container {
        padding: 20px 14px;
      }

      .step-heading {
        font-size: 1.7rem;
      }

      .modality-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <header class="clinic-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">M</div>
        <div class="brand-text">
          <h1>Mangalmurti Clinic</h1>
          <p>Dr. Bhakti Patil · Homeopathic Case Record</p>
        </div>
      </div>
      <div class="progress-area">
        <div class="progress-track">
          <div class="progress-fill" id="globalProgress"></div>
        </div>
        <div class="step-label" id="stepCounter">Step 1 of 7</div>
      </div>
    </div>
  </header>

  <nav class="step-tabs">
    <div class="step-tabs-inner" id="stepTabsContainer"></div>
  </nav>

  <main class="main-container">
    <form id="masterForm" onsubmit="return false;">
      <div id="panelsContainer"></div>
    </form>
  </main>

  <script>
    let currentStepIdx = 0;

    const modalityCategories = {
      'Weather & Environment': ['Hot weather', 'Cold weather', 'Rainy weather', 'Cloudy weather', 'Change of season', 'Thunderstorm', 'Warm bath', 'Cold bathing', 'Sun', 'Draft air'],
      'Position & Movement': ['Covering', 'Lying with head low', 'Sitting', 'Standing', 'Stooping', 'Hanging limbs', 'Raising arms', 'Stretching'],
      'Senses & Stimuli': ['Noise', 'Sudden noise', 'Music', 'Light', 'Strong smells', 'Touch', 'Pressure', 'Massage', 'Tight clothes'],
      'Bodily Functions': ['When constipated', 'Before urine', 'During urine', 'After urine', 'Before menses', 'During menses', 'After menses', 'After sweating', 'When fasting', 'Coughing', 'Sneezing', 'Belching'],
      'Sleep & Activity': ['Before sleep', 'During sleep', 'After sleep', 'Loss of sleep', 'After eating', 'Over eating', 'Physical exertion', 'Reading', 'Talking'],
      'Emotions & Mind': ['When angry', 'When worried', 'When sad', 'After weeping', 'In a crowd', 'When alone', 'In company', 'Consolation'],
      'Time & Misc': ['Morning', 'Afternoon', 'Evening', 'Night', 'Bathing', 'Before stools', 'During stools', 'After stools']
    };
    const allModalityItems = Object.values(modalityCategories).flat();
    const foodItems = ['Bitter', 'Salt extra', 'Sweet', 'Sour', 'Bread', 'Butter', 'Fats', 'Milk', 'Coffee', 'Mud / Chalk', 'Eggs', 'Spicy food', 'Meat', 'Fish', 'Cabbage', 'Onions', 'Warm food / drink', 'Cold food / drink', 'Fruits', 'Anything else'];

    /* ── STORAGE ── */
    const saveModalityValue = (item, val) => localStorage.setItem(`mod_${item.replace(/\s/g, '_')}`, val);
    const getModalityValue = (item) => localStorage.getItem(`mod_${item.replace(/\s/g, '_')}`) || '';
    const saveField = (id, val) => { if (id) localStorage.setItem(`field_${id}`, val); };
    const getField = (id) => localStorage.getItem(`field_${id}`) || '';
    const saveFoodPref = (food, pref) => localStorage.setItem(`food_pref_${food}`, pref);
    const getFoodPref = (food) => localStorage.getItem(`food_pref_${food}`) || '';

    /* ── DATA GATHER ── */
    function gatherAllData() {
      const data = {};
      document.querySelectorAll('input,select,textarea').forEach(el => {
        if (!el.id && el.type !== 'radio') return;
        if (['text', 'number', 'email', 'tel'].includes(el.type) || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') data[el.id] = el.value;
        else if (el.type === 'checkbox') data[el.id] = el.checked;
        else if (el.type === 'radio' && el.checked && el.name) data[el.name] = el.value;
      });
      allModalityItems.forEach(item => { const v = getModalityValue(item); if (v) data[`mod_${item.replace(/\s/g, '_')}`] = v; });
      foodItems.forEach(food => {
        const key = food.replace(/[^a-z0-9]/gi, '_');
        data[`food_pref_${key}`] = getFoodPref(key);
      });
      return data;
    }

    /* ── POPULATE FROM STORAGE ── */
    function populateFromStorage() {
      document.querySelectorAll('input,select,textarea').forEach(el => {
        if (!el.id) return;
        const stored = getField(el.id);
        if (stored && (['text', 'number', 'email', 'tel'].includes(el.type) || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT')) el.value = stored;
        else if (el.type === 'checkbox') el.checked = stored === 'true';
      });
      document.querySelectorAll('input[type="radio"]').forEach(radio => {
        if (radio.name && getField(radio.name) === radio.value) radio.checked = true;
      });
      // food radio
      foodItems.forEach(food => {
        const key = food.replace(/[^a-z0-9]/gi, '_');
        const pref = getFoodPref(key);
        if (pref) {
          const radio = document.querySelector(`input[name="food_${key}"][value="${pref}"]`);
          if (radio) radio.checked = true;
        }
      });
    }

    function attachSaveEvents() {
      document.querySelectorAll('input,select,textarea').forEach(el => {
        if (!el.id) return;
        const h = () => saveField(el.id, el.type === 'checkbox' ? el.checked : el.value);
        el.addEventListener('input', h); el.addEventListener('change', h);
      });
      document.querySelectorAll('input[type="radio"]').forEach(radio => {
        if (radio.name) {
          radio.addEventListener('change', () => { if (radio.checked) saveField(radio.name, radio.value); });
        }
      });
      // food radio save
      foodItems.forEach(food => {
        const key = food.replace(/[^a-z0-9]/gi, '_');
        document.querySelectorAll(`input[name="food_${key}"]`).forEach(r => {
          r.addEventListener('change', () => { if (r.checked) saveFoodPref(key, r.value); });
        });
      });
    }

    /* ── NAVIGATION ── */
    function goToStep(step) {
      step = Math.max(0, Math.min(6, step));
      document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active-panel'));
      const panel = document.getElementById(`panel_${step}`);
      if (panel) panel.classList.add('active-panel');
      currentStepIdx = step;
      updateProgress(); updateTabs();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (step === 6) buildSummary();
    }

    function updateProgress() {
      const pct = ((currentStepIdx + 1) / 7) * 100;
      const bar = document.getElementById('globalProgress');
      if (bar) bar.style.width = pct + '%';
      const lbl = document.getElementById('stepCounter');
      if (lbl) lbl.innerText = `Step ${currentStepIdx + 1} of 7`;
    }

        html += `<div class="modality-section"><div class="modality-section-title">${cat}</div><div class="modality-grid">`;
        items.forEach(item => {
          const saved = getModalityValue(item);
          html += `<div class="modality-row"><span class="mod-name">${item}</span><div class="mod-options">`;
          [['Better', '✓ Better'], ['Worse', '✗ Worse'], ['No effect', '⬤ Neutral']].forEach(([val, label]) => {
            let cls = '';

    /* ── PDF GENERATION ── */
    async function generatePdfDocument() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
      const data = gatherAllData();
      const teal = [26, 74, 63], gold = [193, 127, 58], lightGold = [245, 235, 210], white = [255, 255, 255];
      const pageW = 210, marginX = 14, colW = pageW - marginX * 2;

      // Header band
      doc.setFillColor(...teal);
      doc.rect(0, 0, pageW, 40, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(230, 200, 150);
      doc.text('MANGALMURTI CLINIC', marginX, 16);
      doc.setFontSize(9.5); doc.setTextColor(210, 195, 170); doc.setFont('helvetica', 'normal');
      doc.text('Dr. Bhakti Patil  ·  Homeopathic Case Record', marginX, 25);
      doc.setFontSize(8.5); doc.setTextColor(180, 165, 145);
      doc.text(`Record Date: ${data.p_date || new Date().toLocaleDateString('en-IN')}`, marginX, 33);

      let y = 50;

      // Helper: section title
      function sectionTitle(title, yPos) {
        doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...teal);
        doc.setFillColor(...lightGold);
        doc.roundedRect(marginX, yPos - 5, colW, 9, 2, 2, 'F');
        doc.text(title.toUpperCase(), marginX + 4, yPos + 1);
        return yPos + 13;
      }

      // Helper: simple two-col table
      function twoColTable(rows, yPos) {
        doc.autoTable({
          startY: yPos,
          margin: { left: marginX, right: marginX },
          theme: 'plain',
          styles: { fontSize: 8.5, cellPadding: { top: 4, bottom: 4, left: 5, right: 5 }, lineColor: [220, 210, 195], lineWidth: 0.3, font: 'helvetica' },
          columnStyles: { 0: { fontStyle: 'bold', textColor: [80, 60, 40], cellWidth: 42, fillColor: [252, 248, 242] }, 1: { textColor: [44, 44, 40], fillColor: white } },
          body: rows,
          didDrawPage: () => { }
        });
        return doc.lastAutoTable.finalY + 8;
      }

      // Helper: single long-text row
      function textBlock(label, text, yPos) {
        if (!text || text.trim() === '') return yPos;
        doc.autoTable({
          startY: yPos,
          margin: { left: marginX, right: marginX },
          theme: 'plain',
          styles: { fontSize: 8.5, cellPadding: { top: 4, bottom: 4, left: 5, right: 5 }, lineColor: [220, 210, 195], lineWidth: 0.3, font: 'helvetica' },
          columnStyles: { 0: { fontStyle: 'bold', textColor: [80, 60, 40], cellWidth: 42, fillColor: [252, 248, 242] }, 1: { textColor: [44, 44, 40] } },
          body: [[label, text]],
        });
        return doc.lastAutoTable.finalY + 6;
      }

      // Helper: full-width table
      function fullTable(head, rows, yPos) {
        doc.autoTable({
          startY: yPos,
          margin: { left: marginX, right: marginX },
          head: [head],
          body: rows,
          theme: 'plain',
          headStyles: { fillColor: lightGold, textColor: teal, fontStyle: 'bold', fontSize: 8, halign: 'center' },
          bodyStyles: { fontSize: 8.5, textColor: [44, 44, 40], halign: 'center', lineColor: [220, 210, 195], lineWidth: 0.3, cellPadding: { top: 4, bottom: 4, left: 5, right: 5 } },
          columnStyles: { 0: { halign: 'left', cellWidth: 55 } },
        });
        return doc.lastAutoTable.finalY + 8;
      }

      // ── PATIENT INFO ──
      y = sectionTitle('Patient Information', y);
      y = twoColTable([
        ['Full Name', data.p_name || '—'],
        ['Age', data.p_age || '—'],
        ['Gender', data.p_gender || '—'],
        ['Phone', data.p_tel || '—'],
        ['Email', data.p_email || '—'],
        ['Occupation', data.p_occupation || '—'],
        ['Referred By', data.p_reference || '—'],
        ['Address', data.p_address || '—'],
      ], y);

      // ── COMPLAINTS ──
      y = sectionTitle('Clinical History', y);
      y = textBlock('Chief Complaint', data.c_chief || '—', y);
      y = textBlock('Origin', data.c_origin || '—', y);
      y = textBlock('Impact on Life', data.c_effect || '—', y);
      y = textBlock('Past Illnesses', data.c_past || '—', y);
      y = textBlock('Family History', data.c_family || '—', y);

      // ── MODALITIES ──
      const betterMods = allModalityItems.filter(i => getModalityValue(i) === 'Better');
      const worseMods = allModalityItems.filter(i => getModalityValue(i) === 'Worse');
      const noMods = allModalityItems.filter(i => getModalityValue(i) === 'No effect');
      if (betterMods.length || worseMods.length || noMods.length) {
        y = sectionTitle('Modalities', y);
        const modRows = [];
        if (betterMods.length) modRows.push(['Better From', betterMods.join(', ')]);
        if (worseMods.length) modRows.push(['Worse From', worseMods.join(', ')]);
        if (noMods.length) modRows.push(['No Effect', noMods.join(', ')]);
        y = twoColTable(modRows, y);
      }

      // ── DIET ──
      y = sectionTitle('Diet & Appetite', y);
      y = twoColTable([
        ['Appetite', data.d_appetite || '—'],
        ['Thirst', data.d_thirst || '—'],
        ['Taste / Mouth', data.d_taste || '—'],
      ], y);

      // Food preferences table
      const liked = foodItems.filter(f => getFoodPref(f.replace(/[^a-z0-9]/gi, '_')) === 'Like');
      const disliked = foodItems.filter(f => getFoodPref(f.replace(/[^a-z0-9]/gi, '_')) === 'Dislike');
      const disagreed = foodItems.filter(f => getFoodPref(f.replace(/[^a-z0-9]/gi, '_')) === 'Disagree');
      if (liked.length || disliked.length || disagreed.length) {
        const maxLen = Math.max(liked.length, disliked.length, disagreed.length);
        const foodRows = [];
        for (let i = 0; i < maxLen; i++) {
          foodRows.push([liked[i] || '', disliked[i] || '', disagreed[i] || '']);
        }
        y = fullTable(['✓ Likes', '✗ Dislikes', '! Disagrees With'], foodRows, y);
      }

      // ── MIND ──
      y = sectionTitle('Mind & Emotions', y);
      y = twoColTable([
        ['Nature / Personality', data.m_personality || '—'],
        ['What upsets most', data.m_q1 || '—'],
        ['Anxieties / Fears', data.m_q2 || '—'],
        ['Stress Coping', data.m_q5 || '—'],
        ['Social Style', data.m_introvert || '—'],
        ['Greatest Grief / Joys', data.m_q13 || '—'],
      ], y);

      // ── SLEEP ──
      y = sectionTitle('Sleep & Dreams', y);
      const sleepSyms = [];
      if (data.sl_snore) sleepSyms.push('Snoring');
      if (data.sl_grind) sleepSyms.push('Teeth Grinding');
      if (data.sl_sweat) sleepSyms.push('Night Sweats');

      y = twoColTable([
        ['Sleep Posture', data.s_posture || '—'],
        ['Symptoms', sleepSyms.length ? sleepSyms.join(', ') : 'None noted'],
        ['Dream Themes', data.s_q22 || '—'],
        ['Peculiar Symptoms', data.s_q26 || '—'],
      ], y);

      // Footer
      const totalPages = doc.internal.getNumberOfPages();
      for (let p = 1; p <= totalPages; p++) {
        doc.setPage(p);
        doc.setDrawColor(...gold); doc.setLineWidth(0.4);
        doc.line(marginX, 284, pageW - marginX, 284);
        doc.setFontSize(7.5); doc.setTextColor(130, 110, 90); doc.setFont('helvetica', 'normal');
        doc.text('Mangalmurti Clinic · Dr. Bhakti Patil · Homeopathic Case Record', marginX, 289);
        doc.text(`Page ${p} of ${totalPages}`, pageW - marginX, 289, { align: 'right' });
      }

      const fileName = `Mangalmurti_Case_${(data.p_name || 'patient').replace(/\s/g, '_')}_${Date.now()}.pdf`;
      doc.save(fileName);
    }

      const foodTarget = document.getElementById('foodTableTarget');
      if (modTarget) modTarget.innerHTML = renderModalityPanel();
      if (foodTarget) foodTarget.innerHTML = renderFoodTable();
      initModalityClickHandlers();
      populateFromStorage();
      attachSaveEvents();
      // set today's date if empty
      const dateInput = document.getElementById('p_date');
      if (dateInput && !getField('p_date')) {
        dateInput.value = new Date().toLocaleDateString('en-IN');
        saveField('p_date', dateInput.value);
      }
      document.getElementById('pdfDownloadBtn')?.addEventListener('click', generatePdfDocument);
      updateProgress(); updateTabs();
    }
    init();
  </script>
</body>

</html>
